name: Build and Publish Extension

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test
      - run: npm run build:css
      # The build scripts stage only the files each browser loads, so the
      # published packages never pick up tests, docs, or the other platform's
      # entry points.
      - run: npm run build:all
      - uses: actions/upload-artifact@v4
        with:
          name: launch-observer-chrome
          path: dist/chrome.zip
      - uses: actions/upload-artifact@v4
        with:
          name: launch-observer-firefox
          path: dist/firefox.zip
